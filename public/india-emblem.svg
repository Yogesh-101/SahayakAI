  <text x="32" y="15" font-family="serif" font-size="5" fill="#1a237e" text-anchor="middle" dominant-baseline="middle">&#x265B;</text>
  
  <!-- "8$M/.G5 /$G" text area -->
  <text x="32" y="72" font-family="serif" font-size="5.5" fill="#1a237e" text-anchor="middle" font-weight="bold">8$M/.G5 /$G</text>
  
  <!-- Decorative bottom base -->
