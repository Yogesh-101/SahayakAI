  <circle cx="32" cy="36" r="28" fill="none" stroke="#1a237e" stroke-width="2.5"/>
  <circle cx="32" cy="36" r="24" fill="#1a237e"/>
  
  <!-- Ashoka Chakra (24 spokes) -->
  <circle cx="32" cy="36" r="12" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="32" cy="36" r="3" fill="#ffffff"/>
  <!-- 12 spokes (simplified) -->
  <line x1="32" y1="24" x2="32" y2="36" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="32" y1="36" x2="32" y2="48" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="20" y1="36" x2="32" y2="36" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="32" y1="36" x2="44" y2="36" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="23.5" y1="27.5" x2="32" y2="36" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="32" y1="36" x2="40.5" y2="44.5" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="40.5" y1="27.5" x2="32" y2="36" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="32" y1="36" x2="23.5" y2="44.5" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="26" y1="25" x2="32" y2="36" stroke="#ffffff" stroke-width="0.6"/>
  <line x1="32" y1="36" x2="38" y2="47" stroke="#ffffff" stroke-width="0.6"/>
  <line x1="38" y1="25" x2="32" y2="36" stroke="#ffffff" stroke-width="0.6"/>
  <line x1="32" y1="36" x2="26" y2="47" stroke="#ffffff" stroke-width="0.6"/>
  
  <!-- Four lions silhouette (simplified as pillars at cardinal positions) -->
